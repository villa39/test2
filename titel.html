<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Villa 39 – SVG Export</title>

    <!-- =====================================================
         GOOGLE FONT
         ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --paper: #F1ECDD;
            --red: #E7412D;
            --blue: #1D4C8C;
            --ink: #1C1B18;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 40px;
            background: #555;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            font-size: 20px;
            margin: 0 0 25px;
        }

        #status {
            color: white;
            font-family: monospace;
            margin-bottom: 20px;
        }

        /*
         * ====================================================
         * TRANSPARENTER HINTERGRUND
         * ====================================================
         */

        #preview {
            display: inline-block;
            padding: 50px;

            background-color: white;

            background-image:
                linear-gradient(45deg, #ccc 25%, transparent 25%),
                linear-gradient(-45deg, #ccc 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ccc 75%),
                linear-gradient(-45deg, transparent 75%, #ccc 75%);

            background-size: 40px 40px;

            background-position:
                0 0,
                0 20px,
                20px -20px,
                -20px 0;
        }

        #preview svg {
            display: block;
            width: min(1200px, 80vw);
            height: auto;
        }

        button {
            margin-top: 25px;
            padding: 15px 25px;

            border: none;

            background: var(--ink);
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: var(--red);
        }

        button:disabled {
            opacity: .4;
            cursor: default;
        }

    </style>

</head>


<body>


<h1>Villa 39 – Vektor-SVG</h1>

<div id="status">
    Lade Archivo Black …
</div>

<div id="preview"></div>

<br

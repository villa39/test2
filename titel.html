<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Villa 39 – Export</title>


    <!-- =====================================================
         ARCHIVO BLACK
         ===================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
        rel="stylesheet">


    <style>

        :root {

            --paper: #F1ECDD;
            --red: #E7412D;
            --blue: #1D4C8C;
            --ink: #1C1B18;

        }


        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

        }


        body {

            min-height: 100vh;

            padding: 40px;

            background: #444;

            color: white;

            font-family: Arial, sans-serif;

        }


        h1 {

            margin: 0 0 10px;

            font-size: 22px;

        }


        #status {

            margin-bottom: 25px;

            font-family: monospace;

            line-height: 1.5;

        }


        /*
         * ================================================
         * TRANSPARENZ-VORSCHAU
         * ================================================
         */

        #preview {

            display: inline-block;

            max-width: 100%;

            overflow: auto;

            padding: 40px;

            background-color: white;

            background-image:

                linear-gradient(
                    45deg,
                    #cccccc 25%,
                    transparent 25%
                ),

                linear-gradient(
                    -45deg,
                    #cccccc 25%,
                    transparent 25%
                ),

                linear-gradient(
                    45deg,
                    transparent 75%,
                    #cccccc 75%
                ),

                linear-gradient(
                    -45deg,
                    transparent 75%,
                    #cccccc 75%
                );

            background-size: 40px 40px;

            background-position:

                0 0,
                0 20px,
                20px -20px,
                -20px 0;

        }


        #preview canvas {

            display: block;

            width: min(1200px, 80vw);

            height: auto;

        }


        button {

            display: block;

            margin-top: 25px;

            padding: 16px 28px;

            border: 0;

            background: var(--ink);

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: var(--red);

        }


        button:disabled {

            opacity: .4;

            cursor: default;

        }

    </style>

</head>


<body>


<h1>
    Villa 39 – High Resolution Export
</h1>


<div id="status">
    Initialisiere …
</div>


<div id="preview"></div>


<button id="download"
        disabled>

    PNG herunterladen

</button>


<script>


/* ============================================================
   KONFIGURATION
   ============================================================ */


/*
 * EXAKTER TEXT
 */

const TEXT = "Villa 39";


/*
 * Deine Farben aus style.css
 */

const PAPER = "#F1ECDD";

const RED = "#E7412D";

const BLUE = "#1D4C8C";


/*
 * ZIELBREITE
 *
 * Die fertige PNG wird exakt 10.000 px breit.
 */

const OUTPUT_WIDTH = 10000;


/*
 * Original aus deiner Website:
 *
 * text-shadow:
 *     4px 4px 0 red,
 *    -2px -2px 0 blue;
 *
 * Wir skalieren diese Werte mit der Schriftgröße.
 *
 * Referenz:
 * 80px Schriftgröße
 */

const RED_SHADOW = 4 / 80;

const BLUE_SHADOW = 2 / 80;


/*
 * Rand proportional zur Ausgabegröße.
 */

const PADDING = 0.04;


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(text) {

    document.getElementById("status").textContent =
        text;

}


/* ============================================================
   FONT LADEN
   ============================================================ */

async function loadFont() {


    setStatus(
        "Lade Archivo Black von Google Fonts …"
    );


    /*
     * Wichtig:
     *
     * Wir verwenden GENAU den Namen,
     * den Google Fonts registriert.
     */

    await document.fonts.load(
        '900 100px "Archivo Black"'
    );


    /*
     * Warten bis Font-Loading abgeschlossen ist.
     */

    await document.fonts.ready;


    /*
     * Prüfen.
     */

    const fontLoaded =
        document.fonts.check(
            '900 100px "Archivo Black"'
        );


    if (!fontLoaded) {

        throw new Error(
            "Archivo Black wurde nicht geladen."
        );

    }


    /*
     * Browser explizit zwingen,
     * die Schrift einmal zu verwenden.
     */

    const canvas =
        document.createElement("canvas");


    const ctx =
        canvas.getContext("2d");


    ctx.font =
        '900 100px "Archivo Black"';


    const width =
        ctx.measureText(TEXT).width;


    if (!width || width < 100) {

        throw new Error(
            "Der Browser verwendet offenbar nicht Archivo Black."
        );

    }


    setStatus(
        "✓ Archivo Black erfolgreich geladen"
    );

}


/* ============================================================
   CANVAS ERSTELLEN
   ============================================================ */

function createCanvas() {


    /*
     * Temporäres Mess-Canvas
     */

    const measureCanvas =
        document.createElement("canvas");


    const measure =
        measureCanvas.getContext("2d");


    /*
     * Große Referenzschrift
     */

    const referenceSize = 1000;


    measure.font =
        `900 ${referenceSize}px "Archivo Black"`;


    const reference =
        measure.measureText(TEXT);


    const referenceWidth =
        reference.width;


    /*
     * ========================================================
     * PADDING
     * ========================================================
     */

    const padding =
        OUTPUT_WIDTH * PADDING;


    /*
     * Schatten bei 1000px Fontgröße
     */

    const referenceRed =
        referenceSize * RED_SHADOW;


    const referenceBlue =
        referenceSize * BLUE_SHADOW;


    /*
     * ========================================================
     * SCHRIFTGRÖSSE BERECHNEN
     * ========================================================
     *
     * Wir suchen die Fontgröße, bei der
     * alles zusammen 10.000px breit ist.
     */

    const usableWidth =
        OUTPUT_WIDTH
        - padding * 2
        - referenceRed
        - referenceBlue;


    const scale =
        usableWidth /
        referenceWidth;


    const fontSize =
        referenceSize *
        scale;


    /*
     * Schatten entsprechend skalieren.
     */

    const redOffset =
        fontSize * RED_SHADOW;


    const blueOffset =
        fontSize * BLUE_SHADOW;


    /*
     * ========================================================
     * FINALE MESSUNG
     * ========================================================
     */

    measure.font =
        `900 ${fontSize}px "Archivo Black"`;


    const metrics =
        measure.measureText(TEXT);


    const textWidth =
        metrics.width;


    const ascent =
        metrics.actualBoundingBoxAscent ||
        fontSize * 0.75;


    const descent =
        metrics.actualBoundingBoxDescent ||
        fontSize * 0.15;


    /*
     * Höhe des finalen Bildes
     */

    const height =
        Math.ceil(

            padding * 2
            +
            ascent
            +
            descent
            +
            redOffset
            +
            blueOffset

        );


    /*
     * ========================================================
     * HIGH RESOLUTION CANVAS
     * ========================================================
     */

    const canvas =
        document.createElement("canvas");


    canvas.width =
        OUTPUT_WIDTH;


    canvas.height =
        height;


    /*
     * WICHTIG:
     *
     * Wir füllen den Hintergrund NICHT.
     *
     * Das Canvas startet transparent.
     */

    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha: true
            }
        );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * ========================================================
     * TEXT-EINSTELLUNGEN
     * ========================================================
     */

    ctx.font =
        `900 ${fontSize}px "Archivo Black"`;


    ctx.textBaseline =
        "alphabetic";


    ctx.textAlign =
        "left";


    /*
     * Position
     */

    const x =
        padding + blueOffset;


    const baseline =
        padding
        +
        ascent
        +
        blueOffset;


    /* ========================================================
       BLAUER SCHATTEN
       ======================================================== */

    ctx.fillStyle =
        BLUE;


    ctx.fillText(

        TEXT,

        x + blueOffset,

        baseline - blueOffset

    );


    /* ========================================================
       ROTER SCHATTEN
       ======================================================== */

    ctx.fillStyle =
        RED;


    ctx.fillText(

        TEXT,

        x + redOffset,

        baseline + redOffset

    );


    /* ========================================================
       HAUPTTEXT
       ======================================================== */

    ctx.fillStyle =
        PAPER;


    ctx.fillText(

        TEXT,

        x,

        baseline

    );


    return canvas;

}


/* ============================================================
   PNG DOWNLOAD
   ============================================================ */

function setupDownload(canvas) {


    const button =
        document.getElementById("download");


    button.disabled = false;


    button.addEventListener(
        "click",
        function() {


            setStatus(
                "Erzeuge 10.000px PNG …"
            );


            canvas.toBlob(

                function(blob) {


                    if (!blob) {

                        setStatus(
                            "Fehler beim Erzeugen der PNG."
                        );

                        return;

                    }


                    const url =
                        URL.createObjectURL(blob);


                    const link =
                        document.createElement("a");


                    link.href =
                        url;


                    link.download =
                        "villa-39-schriftzug-10000px.png";


                    document.body.appendChild(link);


                    link.click();


                    document.body.removeChild(link);


                    setTimeout(
                        function() {

                            URL.revokeObjectURL(url);

                        },
                        2000
                    );


                    setStatus(
                        "✓ Fertig – 10.000px PNG mit transparentem Alpha-Kanal"
                    );


                },

                "image/png"

            );

        }
    );

}


/* ============================================================
   START
   ============================================================ */

async function init() {


    try {


        await loadFont();


        setStatus(
            "Erzeuge 10.000px Schriftzug …"
        );


        const canvas =
            createCanvas();


        /*
         * Vorschau anzeigen
         */

        document
            .getElementById("preview")
            .appendChild(canvas);


        setStatus(
            `✓ Fertig – ${canvas.width} × ${canvas.height}px`
        );


        setupDownload(canvas);


    }
    catch (error) {


        console.error(error);


        setStatus(
            "FEHLER: " +
            error.message
        );


    }

}


/* ============================================================
   LOS
   ============================================================ */

init();

</script>


</body>

</html>

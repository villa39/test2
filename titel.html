<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <title>Villa 39 – Vektor Export</title>

    <!-- =====================================================
         GOOGLE FONT
         ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         OPENTYPE.JS
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/opentype.js@2.0.0/dist/opentype.min.js"></script>


    <!-- =====================================================
         WAWOFF2

         Damit können wir die von Google Fonts gelieferte
         WOFF2-Datei im Browser in TTF/OpenType umwandeln.

         Nichts wird hochgeladen.
         ===================================================== -->

    <script src="https://unpkg.com/wawoff2@2.0.1/build/decompress_binding.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background: #555;

            font-family: Arial, sans-serif;

            padding: 40px;

        }


        h1 {

            color: white;

            font-size: 20px;

            margin: 0 0 25px;

        }


        /*
         * Transparenz-Vorschau
         *
         * Das Schachbrett ist NUR die Darstellung
         * im Browser.
         *
         * Es wird NICHT Teil der SVG.
         */

        #preview {

            display: inline-block;

            padding: 60px;

            background-color: white;

            background-image:
                linear-gradient(45deg, #d0d0d0 25%, transparent 25%),
                linear-gradient(-45deg, #d0d0d0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #d0d0d0 75%),
                linear-gradient(-45deg, transparent 75%, #d0d0d0 75%);

            background-size: 40px 40px;

            background-position:
                0 0,
                0 20px,
                20px -20px,
                -20px 0;

        }


        /*
         * SVG-Vorschau.

         * Nur die Bildschirmdarstellung.
         *
         * Die heruntergeladene SVG hat keine
         * Pixelauflösung.
         */

        #preview svg {

            display: block;

            width: min(1200px, 80vw);

            height: auto;

        }


        #status {

            margin-top: 25px;

            color: white;

            font-family: monospace;

        }


        button {

            margin-top: 25px;

            padding: 15px 25px;

            border: none;

            background: #1C1B18;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #E7412D;

        }


    </style>

</head>


<body>


<h1>
    Villa 39 – echter SVG-Vektor
</h1>


<div id="preview">
    Lade Archivo Black …
</div>


<div id="status">
    Font wird geladen …
</div>


<button id="download" disabled>
    SVG herunterladen
</button>


<script>


/* ============================================================
   EINSTELLUNGEN
   ============================================================ */


/*
 * Exakt dein Hero-Schriftzug
 */

const TEXT = "Villa 39";


/*
 * Farben aus deinem CSS
 */

const PAPER = "#F1ECDD";

const RED = "#E7412D";

const BLUE = "#1D4C8C";


/*
 * Sehr große virtuelle Zeichenhöhe.

 * Das sind SVG-Koordinaten,
 * keine Pixel.

 * Dadurch haben wir sehr präzise
 * Vektorkoordinaten.
 */

const FONT_SIZE = 1000;


/*
 * Rand um den Schriftzug
 */

const PADDING = 100;


/*
 * Deine ursprünglichen CSS-Schatten:

     text-shadow:
         4px 4px 0 red,
        -2px -2px 0 blue;

 * Wir skalieren diese proportional
 * zur Schriftgröße.

 * Dadurch bleiben die Schatten auch
 * bei beliebiger SVG-Größe proportional.
 */

const RED_X = FONT_SIZE * 4 / 80;

const RED_Y = FONT_SIZE * 4 / 80;

const BLUE_X = FONT_SIZE * 2 / 80;

const BLUE_Y = FONT_SIZE * 2 / 80;


/* ============================================================
   GOOGLE-FONT-CSS HOLEN
   ============================================================ */

async function getGoogleFontURL() {


    const response = await fetch(

        "https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"

    );


    if (!response.ok) {

        throw new Error(
            "Google Fonts konnte nicht geladen werden."
        );

    }


    const css = await response.text();


    /*
     * Google liefert normalerweise eine oder mehrere
     * WOFF2-Dateien.

     * Wir nehmen die erste passende Datei.
     */

    const matches = css.match(
        /url\(([^)]+\.woff2)\)/g
    );


    if (!matches || !matches.length) {

        throw new Error(
            "Keine WOFF2-Datei in Google-Fonts-CSS gefunden."
        );

    }


    return matches[0]
        .replace(/^url\(/, "")
        .replace(/\)$/, "");

}


/* ============================================================
   FONT LADEN
   ============================================================ */

async function loadFont() {


    document.getElementById("status").textContent =
        "1/4 – Archivo Black wird geladen …";


    /*
     * URL der Google-Font-Datei
     */

    const fontURL =
        await getGoogleFontURL();


    /*
     * WOFF2 herunterladen
     */

    const response =
        await fetch(fontURL);


    const woff2Buffer =
        await response.arrayBuffer();


    document.getElementById("status").textContent =
        "2/4 – WOFF2 wird dekomprimiert …";


    /*
     * WOFF2 → TTF/OpenType

     * Das passiert komplett lokal
     * im Browser.
     */

    const decompressed =
        Module.decompress(
            new Uint8Array(woff2Buffer)
        );


    /*
     * Uint8Array → ArrayBuffer
     */

    const arrayBuffer =
        decompressed.buffer.slice(
            decompressed.byteOffset,
            decompressed.byteOffset +
            decompressed.byteLength
        );


    document.getElementById("status").textContent =
        "3/4 – Vektor-Glyphen werden erzeugt …";


    /*
     * TTF/OpenType parsen
     */

    return opentype.parse(arrayBuffer);

}


/* ============================================================
   SVG ERZEUGEN
   ============================================================ */

async function createSVG() {


    try {


        const font =
            await loadFont();


        /* ----------------------------------------------------
           TEXT MESSEN
           ---------------------------------------------------- */

        const measurement =
            font.getPath(
                TEXT,
                0,
                0,
                FONT_SIZE
            );


        const bbox =
            measurement.getBoundingBox();


        const textWidth =
            bbox.x2 - bbox.x1;


        const textHeight =
            bbox.y2 - bbox.y1;


        /* ----------------------------------------------------
           SVG DIMENSIONEN
           ---------------------------------------------------- */

        const width =
            textWidth +
            RED_X +
            BLUE_X +
            PADDING * 2;


        const height =
            textHeight +
            RED_Y +
            BLUE_Y +
            PADDING * 2;


        /* ----------------------------------------------------
           POSITION
           ---------------------------------------------------- */

        const x =
            PADDING - bbox.x1;


        const baseline =
            PADDING - bbox.y1;


        /* ----------------------------------------------------
           BLAUER VERSATZ
           ---------------------------------------------------- */

        const bluePath =
            font.getPath(

                TEXT,

                x - BLUE_X,

                baseline + BLUE_Y,

                FONT_SIZE,

                {
                    kerning: true
                }

            );


        /* ----------------------------------------------------
           ROTER VERSATZ
           ---------------------------------------------------- */

        const redPath =
            font.getPath(

                TEXT,

                x + RED_X,

                baseline + RED_Y,

                FONT_SIZE,

                {
                    kerning: true
                }

            );


        /* ----------------------------------------------------
           HAUPTSCHRIFT
           ---------------------------------------------------- */

        const mainPath =
            font.getPath(

                TEXT,

                x,

                baseline,

                FONT_SIZE,

                {
                    kerning: true
                }

            );


        /*
         * ====================================================
         * SVG
         * ====================================================

         * WICHTIG:

         * Hier werden ausschließlich <path>-Elemente
         * erzeugt.

         * KEIN <text>
         * KEIN Canvas
         * KEIN PNG
         * KEIN JPG
         * KEIN eingebettetes Bitmap.

         * Die Buchstaben sind Bézierkurven.
         */

        const svg = `<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"

    viewBox="0 0 ${width} ${height}"

    width="${width}"
    height="${height}"

    version="1.1"
>


    <!-- =================================================
         BLAUER RISO-VERSATZ
         ================================================= -->

    <path
        d="${bluePath.toPathData(3)}"
        fill="${BLUE}"
    />


    <!-- =================================================
         ROTER RISO-VERSATZ
         ================================================= -->

    <path
        d="${redPath.toPathData(3)}"
        fill="${RED}"
    />


    <!-- =================================================
         HAUPTSCHRIFT
         ================================================= -->

    <path
        d="${mainPath.toPathData(3)}"
        fill="${PAPER}"
    />


</svg>`;


        /* ----------------------------------------------------
           VORSCHAU
           ---------------------------------------------------- */

        document.getElementById("preview").innerHTML =
            svg;


        document.getElementById("status").textContent =
            "✓ Fertig – echte Vektorpfade erzeugt.";


        /* ----------------------------------------------------
           DOWNLOAD AKTIVIEREN
           ---------------------------------------------------- */

        const button =
            document.getElementById("download");


        button.disabled = false;


        button.onclick = function() {


            /*
             * SVG als Text speichern
             */

            const blob =
                new Blob(

                    [svg],

                    {
                        type:
                            "image/svg+xml;charset=utf-8"
                    }

                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = url;


            link.download =
                "villa-39-schriftzug-vector.svg";


            document.body.appendChild(link);


            link.click();


            document.body.removeChild(link);


            setTimeout(
                () => URL.revokeObjectURL(url),
                1000
            );


        };


    }


    catch (error) {


        console.error(error);


        document.getElementById("status").textContent =
            "FEHLER: " + error.message;


        document.getElementById("preview").innerHTML =

            `<p style="
                color:red;
                font-family:monospace;
                font-size:16px;
            ">
                ${error.message}
            </p>`;

    }

}


/*
 * START
 */

loadFont()
    .then(() => createSVG());


</script>


</body>

</html>

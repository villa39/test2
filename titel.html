<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<title>Villa 39 Export</title>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #333;
    color: white;
    font-family: Arial, sans-serif;
    padding: 30px;
}

h1 {
    margin: 0 0 10px;
    font-size: 20px;
}

#status {
    font-family: monospace;
    margin-bottom: 25px;
}

/* Transparenz-Vorschau */

#preview {
    display: inline-block;
    padding: 30px;

    background-color: white;

    background-image:
        linear-gradient(45deg, #ccc 25%, transparent 25%),
        linear-gradient(-45deg, #ccc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ccc 75%),
        linear-gradient(-45deg, transparent 75%, #ccc 75%);

    background-size: 30px 30px;

    background-position:
        0 0,
        0 15px,
        15px -15px,
        -15px 0;

    max-width: calc(100vw - 60px);
    overflow: auto;
}

#preview img {
    display: block;
    width: min(1200px, calc(100vw - 120px));
    height: auto;
}

button {
    display: block;

    margin-top: 25px;

    padding: 14px 24px;

    border: none;

    background: #E7412D;

    color: white;

    font-weight: bold;

    font-size: 16px;

    cursor: pointer;
}

button:disabled {
    opacity: .4;
    cursor: default;
}

</style>
</head>


<body>

<h1>Villa 39 – 10.000px Export</h1>

<div id="status">
    Lade Schrift …
</div>

<div id="preview"></div>

<button id="download" disabled>
    PNG herunterladen
</button>


<script>


/* ============================================================
   EINSTELLUNGEN
   ============================================================ */

const TEXT = "Villa 39";

const OUTPUT_WIDTH = 10000;


/*
 * Farben aus deiner Website
 */

const MAIN_COLOR = "#F1ECDD";
const RED = "#E7412D";
const BLUE = "#1D4C8C";


/*
 * Deine originalen Schatten:
 *
 * text-shadow:
 *     4px 4px 0 red,
 *    -2px -2px 0 blue;
 *
 * Wir skalieren diese proportional.
 */


/* ============================================================
   STATUS
   ============================================================ */

const status =
    document.getElementById("status");


function setStatus(text) {

    status.textContent = text;

}


/* ============================================================
   FONT WARTEN
   ============================================================ */

async function waitForFont() {

    setStatus("Lade Archivo Black …");


    /*
     * Warten bis Google Fonts fertig ist.
     */

    await document.fonts.ready;


    /*
     * Font explizit laden.
     */

    await document.fonts.load(
        '900 100px "Archivo Black"'
    );


    /*
     * Noch einmal warten.
     */

    await document.fonts.ready;


    /*
     * Testelement erzeugen.
     */

    const test =
        document.createElement("span");


    test.style.position = "absolute";

    test.style.left = "-99999px";

    test.style.top = "-99999px";

    test.style.fontFamily =
        '"Archivo Black", sans-serif';

    test.style.fontSize = "100px";

    test.style.fontWeight = "900";

    test.style.whiteSpace = "nowrap";

    test.textContent = TEXT;


    document.body.appendChild(test);


    /*
     * Browser muss das Element jetzt tatsächlich
     * mit der Schrift layouten.
     */

    const width =
        test.getBoundingClientRect().width;


    const height =
        test.getBoundingClientRect().height;


    document.body.removeChild(test);


    if (width < 100 || height < 20) {

        throw new Error(
            "Archivo Black konnte nicht geladen werden."
        );

    }


    setStatus(
        "✓ Archivo Black geladen"
    );


    return true;

}


/* ============================================================
   SVG ERZEUGEN
   ============================================================ */

function createSVG() {


    /*
     * Wir benutzen eine SVG-Datei als Zwischenformat.
     *
     * Dadurch wird der Schriftzug zunächst als
     * skalierbares SVG gerendert.
     */


    const SVG_WIDTH = 1000;


    /*
     * Wir nehmen eine feste SVG-Schriftgröße.
     */

    const FONT_SIZE = 100;


    /*
     * Schatten proportional zu deinem CSS.
     *
     * Bei 100px Schrift:
     *
     * rot  = 5px
     * blau = 2.5px
     *
     * entspricht sehr nah deiner ursprünglichen
     * 4px / 2px bei ~80px.
     */

    const RED_X = 5;

    const RED_Y = 5;

    const BLUE_X = -2.5;

    const BLUE_Y = -2.5;


    /*
     * Temporäres DOM-Element zum Messen.
     */

    const measure =
        document.createElement("span");


    measure.style.position =
        "absolute";

    measure.style.left =
        "-99999px";

    measure.style.top =
        "-99999px";

    measure.style.fontFamily =
        '"Archivo Black"';

    measure.style.fontWeight =
        "900";

    measure.style.fontSize =
        FONT_SIZE + "px";

    measure.style.whiteSpace =
        "nowrap";

    measure.textContent =
        TEXT;


    document.body.appendChild(measure);


    const rect =
        measure.getBoundingClientRect();


    const textWidth =
        rect.width;


    const textHeight =
        rect.height;


    document.body.removeChild(measure);


    /*
     * Breiter Sicherheitsrand.
     */

    const padding =
        30;


    const svgWidth =
        textWidth
        +
        padding * 2
        +
        Math.abs(BLUE_X)
        +
        RED_X;


    const svgHeight =
        textHeight
        +
        padding * 2
        +
        RED_Y
        +
        Math.abs(BLUE_Y);


    /*
     * ========================================================
     * SVG
     * ========================================================
     */

    const svg = `

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="${svgWidth}"
    height="${svgHeight}"
    viewBox="0 0 ${svgWidth} ${svgHeight}"
>

    <!--

        Transparenter Hintergrund.

        Es gibt KEIN rect.

    -->


    <!-- Blauer Schatten -->

    <text
        x="${padding + BLUE_X}"
        y="${padding + textHeight}"
        font-family="Archivo Black"
        font-weight="900"
        font-size="${FONT_SIZE}px"
        fill="${BLUE}"
    >${TEXT}</text>


    <!-- Roter Schatten -->

    <text
        x="${padding + RED_X}"
        y="${padding + textHeight + RED_Y}"
        font-family="Archivo Black"
        font-weight="900"
        font-size="${FONT_SIZE}px"
        fill="${RED}"
    >${TEXT}</text>


    <!-- Hauptschrift -->

    <text
        x="${padding}"
        y="${padding + textHeight}"
        font-family="Archivo Black"
        font-weight="900"
        font-size="${FONT_SIZE}px"
        fill="${MAIN_COLOR}"
    >${TEXT}</text>

</svg>
`;


    return {
        svg,
        width: svgWidth,
        height: svgHeight
    };

}


/* ============================================================
   SVG → PNG
   ============================================================ */

async function renderPNG() {


    setStatus(
        "Erzeuge Vektor-Zwischenschritt …"
    );


    const result =
        createSVG();


    /*
     * SVG Blob
     */

    const blob =
        new Blob(
            [result.svg],
            {
                type: "image/svg+xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    /*
     * SVG als Bild laden.
     */

    const image =
        new Image();


    image.decoding =
        "async";


    image.src =
        url;


    await new Promise(
        (resolve, reject) => {

            image.onload =
                resolve;

            image.onerror =
                reject;

        }
    );


    /*
     * ========================================================
     * 10.000px CANVAS
     * ========================================================
     */

    const scale =
        OUTPUT_WIDTH / result.width;


    const outputHeight =
        Math.ceil(
            result.height * scale
        );


    const canvas =
        document.createElement("canvas");


    canvas.width =
        OUTPUT_WIDTH;


    canvas.height =
        outputHeight;


    /*
     * Wichtig:
     *
     * Alpha ist standardmäßig aktiv.
     *
     * Wir malen KEINEN Hintergrund.
     */

    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * SVG auf 10.000px skalieren.
     */

    ctx.drawImage(
        image,
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * Aufräumen.
     */

    URL.revokeObjectURL(url);


    setStatus(
        `✓ ${canvas.width} × ${canvas.height}px – transparenter Hintergrund`
    );


    return canvas;

}


/* ============================================================
   START
   ============================================================ */

let finalCanvas = null;


async function init() {

    try {

        await waitForFont();


        finalCanvas =
            await renderPNG();


        /*
         * Vorschau
         */

        const preview =
            document.getElementById("preview");


        /*
         * Wir zeigen die 10.000px-Datei
         * verkleinert im Browser an.
         */

        const previewImage =
            document.createElement("img");


        previewImage.src =
            finalCanvas.toDataURL("image/png");


        preview.appendChild(
            previewImage
        );


        /*
         * Download aktivieren.
         */

        const button =
            document.getElementById("download");


        button.disabled =
            false;


        button.onclick =
            async function() {


                setStatus(
                    "PNG wird gespeichert …"
                );


                finalCanvas.toBlob(
                    function(blob) {


                        const url =
                            URL.createObjectURL(blob);


                        const link =
                            document.createElement("a");


                        link.href =
                            url;


                        link.download =
                            "villa-39-schriftzug-10000px.png";


                        document.body.appendChild(
                            link
                        );


                        link.click();


                        link.remove();


                        setTimeout(
                            () => {

                                URL.revokeObjectURL(
                                    url
                                );

                            },
                            2000
                        );


                        setStatus(
                            "✓ Fertig – 10.000px PNG mit Alpha-Kanal"
                        );


                    },
                    "image/png"
                );

            };


    }
    catch (error) {

        console.error(error);


        setStatus(
            "FEHLER: " +
            error.message
        );

    }

}


init();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Villa 39 – Export</title>


<!-- ============================================================
     EXAKT DIE SCHRIFTART DER ORIGINAL-WEBSITE
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600;700&family=Permanent+Marker&display=swap"
    rel="stylesheet"
>


<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    background: #333;

    color: white;

    font-family: Arial, sans-serif;

    padding: 30px;

}

h1 {

    margin: 0 0 10px;

    font-size: 20px;

}

#status {

    font-family: monospace;

    margin-bottom: 25px;

}


/* ============================================================
   TRANSPARENZ-VORSCHAU
   ============================================================ */

#preview {

    display: inline-block;

    padding: 30px;

    max-width: calc(100vw - 60px);

    overflow: auto;

    background-color: white;

    background-image:

        linear-gradient(
            45deg,
            #ccc 25%,
            transparent 25%
        ),

        linear-gradient(
            -45deg,
            #ccc 25%,
            transparent 25%
        ),

        linear-gradient(
            45deg,
            transparent 75%,
            #ccc 75%
        ),

        linear-gradient(
            -45deg,
            transparent 75%,
            #ccc 75%
        );

    background-size: 30px 30px;

    background-position:

        0 0,
        0 15px,
        15px -15px,
        -15px 0;

}


#preview img {

    display: block;

    width: min(
        1200px,
        calc(100vw - 120px)
    );

    height: auto;

}


button {

    display: block;

    margin-top: 25px;

    padding: 14px 24px;

    border: none;

    background: #E7412D;

    color: white;

    font-weight: bold;

    font-size: 16px;

    cursor: pointer;

}


button:hover {

    background: #1D4C8C;

}


button:disabled {

    opacity: .4;

    cursor: default;

}

</style>

</head>


<body>


<h1>
    Villa 39 – 10.000px Export
</h1>


<div id="status">
    Lade Archivo Black …
</div>


<div id="preview"></div>


<button id="download" disabled>
    PNG herunterladen
</button>


<script>


/* ============================================================
   KONFIGURATION
   ============================================================ */

const TEXT = "Villa 39";

const OUTPUT_WIDTH = 10000;


/*
 * EXAKTE FARBEN AUS DEINEM ORIGINAL-CSS
 */

const MAIN_COLOR = "#F1ECDD";

const RED = "#E7412D";

const BLUE = "#1D4C8C";


/*
 * ============================================================
 * SCHLAGSCHATTEN
 * ============================================================
 *
 * Original deiner Website:
 *
 * text-shadow:
 *     4px 4px 0 var(--riso-red),
 *    -2px -2px 0 var(--riso-blue);
 *
 * Für den Export etwas kompakter:
 *
 * Rot:  3px
 * Blau: 1.5px
 *
 * Die Werte werden anschließend proportional
 * zur tatsächlichen Schriftgröße hochskaliert.
 */

const RED_OFFSET = 3;

const BLUE_OFFSET = 1.5;


/*
 * Referenz-Schriftgröße.
 *
 * Alle Schatten werden relativ dazu berechnet.
 */

const REFERENCE_FONT_SIZE = 100;


/* ============================================================
   STATUS
   ============================================================ */

const status =
    document.getElementById("status");


function setStatus(text) {

    status.textContent = text;

}


/* ============================================================
   GOOGLE FONT LADEN
   ============================================================ */

async function waitForFont() {

    setStatus(
        "Lade Archivo Black von Google Fonts …"
    );


    /*
     * Warten bis alle Webfonts fertig geladen sind.
     */

    await document.fonts.ready;


    /*
     * Archivo Black explizit anfordern.
     */

    await document.fonts.load(
        '900 100px "Archivo Black"'
    );


    await document.fonts.ready;


    /*
     * Prüfen, ob der Font tatsächlich verfügbar ist.
     */

    if (
        !document.fonts.check(
            '900 100px "Archivo Black"'
        )
    ) {

        throw new Error(
            "Archivo Black konnte nicht geladen werden."
        );

    }


    /*
     * Zusätzliches echtes DOM-Mess-Element.
     *
     * Damit stellen wir sicher, dass der Browser
     * die Schrift tatsächlich für Layout verwendet.
     */

    const test =
        document.createElement("span");


    test.style.position =
        "absolute";

    test.style.left =
        "-99999px";

    test.style.top =
        "-99999px";

    test.style.fontFamily =
        '"Archivo Black", sans-serif';

    test.style.fontWeight =
        "900";

    test.style.fontSize =
        "100px";

    test.style.whiteSpace =
        "nowrap";

    test.textContent =
        TEXT;


    document.body.appendChild(test);


    const rect =
        test.getBoundingClientRect();


    const width =
        rect.width;


    document.body.removeChild(test);


    if (width < 100) {

        throw new Error(
            "Die Schrift wurde nicht korrekt gerendert."
        );

    }


    setStatus(
        "✓ Archivo Black geladen"
    );

}


/* ============================================================
   SVG ERZEUGEN
   ============================================================ */

function createSVG() {


    /*
     * Wir verwenden eine Referenzgröße.
     *
     * Das SVG wird später verlustfrei auf 10.000px
     * hochskaliert.
     */

    const FONT_SIZE =
        REFERENCE_FONT_SIZE;


    /*
     * Unsichtbares Mess-Element.
     */

    const measure =
        document.createElement("span");


    measure.style.position =
        "absolute";

    measure.style.left =
        "-99999px";

    measure.style.top =
        "-99999px";

    measure.style.fontFamily =
        '"Archivo Black", sans-serif';

    measure.style.fontWeight =
        "900";

    measure.style.fontSize =
        FONT_SIZE + "px";

    measure.style.lineHeight =
        "1";

    measure.style.whiteSpace =
        "nowrap";

    measure.textContent =
        TEXT;


    document.body.appendChild(measure);


    const rect =
        measure.getBoundingClientRect();


    const textWidth =
        rect.width;


    const textHeight =
        rect.height;


    document.body.removeChild(measure);


    /*
     * Falls aus irgendeinem Grund keine Schrift
     * gemessen wurde.
     */

    if (textWidth <= 0) {

        throw new Error(
            "Text konnte nicht gemessen werden."
        );

    }


    /*
     * Großzügiger Rand.
     */

    const padding = 25;


    /*
     * Gesamtabmessungen.
     */

    const svgWidth =
        textWidth
        +
        padding * 2
        +
        Math.abs(BLUE_OFFSET)
        +
        RED_OFFSET;


    const svgHeight =
        textHeight
        +
        padding * 2
        +
        RED_OFFSET
        +
        Math.abs(BLUE_OFFSET);


    /*
     * ========================================================
     * SVG
     * ========================================================
     *
     * KEIN Hintergrund-Element!
     *
     * Dadurch bleibt alles außerhalb des Textes
     * vollständig transparent.
     */

    const svg = `

<svg
    xmlns="http://www.w3.org/2000/svg"

    width="${svgWidth}"

    height="${svgHeight}"

    viewBox="0 0 ${svgWidth} ${svgHeight}"

>


    <!-- =====================================================
         BLAUER SCHATTEN
         ===================================================== -->

    <text

        x="${padding - BLUE_OFFSET}"

        y="${padding + textHeight - BLUE_OFFSET}"

        font-family="Archivo Black"

        font-weight="900"

        font-size="${FONT_SIZE}px"

        fill="${BLUE}"

    >${TEXT}</text>


    <!-- =====================================================
         ROTER SCHATTEN
         ===================================================== -->

    <text

        x="${padding + RED_OFFSET}"

        y="${padding + textHeight + RED_OFFSET}"

        font-family="Archivo Black"

        font-weight="900"

        font-size="${FONT_SIZE}px"

        fill="${RED}"

    >${TEXT}</text>


    <!-- =====================================================
         HAUPTTEXT
         ===================================================== -->

    <text

        x="${padding}"

        y="${padding + textHeight}"

        font-family="Archivo Black"

        font-weight="900"

        font-size="${FONT_SIZE}px"

        fill="${MAIN_COLOR}"

    >${TEXT}</text>


</svg>

`;


    return {

        svg,

        width: svgWidth,

        height: svgHeight

    };

}


/* ============================================================
   SVG → 10.000px PNG
   ============================================================ */

async function renderPNG() {


    setStatus(
        "Erzeuge hochauflösenden Schriftzug …"
    );


    const result =
        createSVG();


    /*
     * SVG als Blob.
     */

    const blob =
        new Blob(

            [result.svg],

            {
                type:
                    "image/svg+xml;charset=utf-8"
            }

        );


    const url =
        URL.createObjectURL(blob);


    /*
     * SVG laden.
     */

    const image =
        new Image();


    image.decoding =
        "async";


    image.src =
        url;


    await new Promise(
        (resolve, reject) => {

            image.onload =
                resolve;

            image.onerror =
                reject;

        }
    );


    /*
     * ========================================================
     * ZIELGRÖSSE
     * ========================================================
     */

    const scale =
        OUTPUT_WIDTH /
        result.width;


    const outputHeight =
        Math.ceil(
            result.height * scale
        );


    /*
     * 10.000px Canvas.
     */

    const canvas =
        document.createElement("canvas");


    canvas.width =
        OUTPUT_WIDTH;


    canvas.height =
        outputHeight;


    /*
     * Transparenter Canvas.
     */

    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha: true
            }
        );


    /*
     * NICHT weiß füllen!
     */

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * SVG auf die komplette Zielgröße
     * hochskalieren.
     */

    ctx.drawImage(

        image,

        0,
        0,

        canvas.width,
        canvas.height

    );


    URL.revokeObjectURL(url);


    setStatus(
        `✓ Fertig: ${canvas.width} × ${canvas.height}px`
    );


    return canvas;

}


/* ============================================================
   START
   ============================================================ */

let finalCanvas = null;


async function init() {

    try {


        /*
         * Font laden.
         */

        await waitForFont();


        /*
         * PNG erzeugen.
         */

        finalCanvas =
            await renderPNG();


        /*
         * ====================================================
         * VORSCHAU
         * ====================================================
         */

        const preview =
            document.getElementById(
                "preview"
            );


        const previewImage =
            document.createElement("img");


        /*
         * Vorschau aus der fertigen PNG.
         */

        previewImage.src =
            finalCanvas.toDataURL(
                "image/png"
            );


        preview.appendChild(
            previewImage
        );


        /*
         * ====================================================
         * DOWNLOAD
         * ====================================================
         */

        const button =
            document.getElementById(
                "download"
            );


        button.disabled =
            false;


        button.onclick =
            function() {


                setStatus(
                    "PNG wird gespeichert …"
                );


                finalCanvas.toBlob(

                    function(blob) {


                        if (!blob) {

                            setStatus(
                                "Fehler beim PNG-Export."
                            );

                            return;

                        }


                        const url =
                            URL.createObjectURL(
                                blob
                            );


                        const link =
                            document.createElement(
                                "a"
                            );


                        link.href =
                            url;


                        link.download =
                            "villa-39-schriftzug-10000px.png";


                        document.body.appendChild(
                            link
                        );


                        link.click();


                        link.remove();


                        setTimeout(

                            function() {

                                URL.revokeObjectURL(
                                    url
                                );

                            },

                            2000

                        );


                        setStatus(
                            "✓ PNG mit transparentem Alpha-Kanal gespeichert"
                        );


                    },

                    "image/png"

                );

            };


    }
    catch (error) {


        console.error(error);


        setStatus(
            "FEHLER: " +
            error.message
        );

    }

}


/*
 * Los geht's.
 */

init();

</script>

</body>
</html>

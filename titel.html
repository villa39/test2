<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <title>Villa 39 – SVG Vektor Export</title>

    <!-- =====================================================
         GOOGLE FONT
         ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
        rel="stylesheet"
    >

    <!-- opentype.js -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

    <!-- WOFF2 Decoder -->
    <script src="https://unpkg.com/wawoff2@2.0.1/build/decompress_binding.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            padding: 40px;

            background: #555;

            font-family: Arial, sans-serif;

        }


        h1 {

            color: white;

            font-size: 20px;

            margin: 0 0 25px;

        }


        /*
         * ====================================================
         * TRANSPARENZ-VORSCHAU
         * ====================================================
         */

        #preview {

            display: inline-block;

            padding: 60px;

            background-color: white;

            background-image:

                linear-gradient(
                    45deg,
                    #d0d0d0 25%,
                    transparent 25%
                ),

                linear-gradient(
                    -45deg,
                    #d0d0d0 25%,
                    transparent 25%
                ),

                linear-gradient(
                    45deg,
                    transparent 75%,
                    #d0d0d0 75%
                ),

                linear-gradient(
                    -45deg,
                    transparent 75%,
                    #d0d0d0 75%
                );

            background-size: 40px 40px;

            background-position:
                0 0,
                0 20px,
                20px -20px,
                -20px 0;

        }


        /*
         * Bildschirmvorschau
         *
         * Die heruntergeladene SVG hat diese
         * Größenbegrenzung NICHT.
         */

        #preview svg {

            display: block;

            width: min(1200px, 80vw);

            height: auto;

        }


        #status {

            margin-top: 20px;

            color: white;

            font-family: monospace;

            font-size: 14px;

        }


        button {

            margin-top: 25px;

            padding: 15px 25px;

            border: 0;

            background: #1C1B18;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #E7412D;

        }


    </style>

</head>


<body>


<h1>
    Villa 39 – echter Vektor
</h1>


<div id="preview">
    Lade …
</div>


<div id="status">
    Initialisiere …
</div>


<button id="download" disabled>
    SVG herunterladen
</button>


<script>


/* ============================================================
   EINSTELLUNGEN
   ============================================================ */


/*
 * EXAKT der Text aus deinem Hero
 */
const TEXT = "Villa 39";


/*
 * Deine CSS-Farben
 */
const PAPER = "#F1ECDD";

const RED = "#E7412D";

const BLUE = "#1D4C8C";


/*
 * Große interne SVG-Koordinaten.

 * DAS SIND KEINE PIXEL.

 * Das SVG bleibt beliebig skalierbar.
 */
const FONT_SIZE = 1000;


/*
 * Rand
 */
const PADDING = 100;


/*
 * Dein ursprünglicher CSS-Text-Shadow:

    4px 4px 0 red,
   -2px -2px 0 blue

 * Wir verwenden dieselbe Relation,
 * nur proportional zur Vektorgröße.
 */

const RED_OFFSET = FONT_SIZE * 4 / 80;

const BLUE_OFFSET = FONT_SIZE * 2 / 80;


/* ============================================================
   GOOGLE-FONT-CSS LADEN
   ============================================================ */

async function getFontCSS() {


    /*
     * Wichtig:

     * User-Agent wie ein normaler Browser setzen.

     * Google Fonts liefert sonst teilweise eine andere
     * Fontvariante.
     */

    const response = await fetch(

        "https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap",

        {
            headers: {
                "Accept":
                    "text/css"
            }
        }

    );


    if (!response.ok) {

        throw new Error(
            "Google Fonts konnte nicht geladen werden."
        );

    }


    return await response.text();

}


/* ============================================================
   WOFF2-URL AUS GOOGLE CSS HOLEN
   ============================================================ */

function findLatinFontURL(css) {


    /*
     * Google Fonts liefert mehrere @font-face-Blöcke.

     * Wir suchen zuerst gezielt den Block,
     * der "latin" enthält.
     */


    const blocks =
        css.split("@font-face");


    for (const block of blocks) {


        if (
            block.includes("latin") ||
            block.includes("U+0000-00FF")
        ) {


            const match =
                block.match(
                    /url\(([^)]+\.woff2)\)/
                );


            if (match) {

                return match[1];

            }

        }

    }


    /*
     * Fallback:
     * erste WOFF2-Datei
     */

    const fallback =
        css.match(
            /url\(([^)]+\.woff2)\)/
        );


    if (fallback) {

        return fallback[1];

    }


    throw new Error(
        "Archivo-Black-WOFF2 wurde nicht gefunden."
    );

}


/* ============================================================
   WOFF2 LADEN UND DEKOMPRIMIEREN
   ============================================================ */

async function loadFont() {


    document.getElementById("status").textContent =
        "Archivo Black wird geladen …";


    const css =
        await getFontCSS();


    const fontURL =
        findLatinFontURL(css);


    console.log(
        "Archivo Black:",
        fontURL
    );


    /*
     * WOFF2 herunterladen
     */

    const response =
        await fetch(fontURL);


    if (!response.ok) {

        throw new Error(
            "Fontdatei konnte nicht heruntergeladen werden."
        );

    }


    const buffer =
        await response.arrayBuffer();


    document.getElementById("status").textContent =
        "WOFF2 wird in OpenType umgewandelt …";


    /*
     * ========================================================
     * WOFF2 → TTF
     * ========================================================
     */

    const result =
        Module.decompress(
            new Uint8Array(buffer)
        );


    /*
     * ArrayBuffer erzeugen
     */

    const arrayBuffer =
        result.buffer.slice(
            result.byteOffset,
            result.byteOffset +
            result.byteLength
        );


    /*
     * OpenType parsen
     */

    const font =
        opentype.parse(arrayBuffer);


    return font;

}


/* ============================================================
   SVG ERZEUGEN
   ============================================================ */

async function createSVG() {


    try {


        const font =
            await loadFont();


        document.getElementById("status").textContent =
            "Vektorpfade werden erzeugt …";


        /*
         * ====================================================
         * TEXT MESSEN
         * ====================================================
         */

        const measurement =
            font.getPath(

                TEXT,

                0,

                0,

                FONT_SIZE

            );


        const bbox =
            measurement.getBoundingBox();


        const textWidth =
            bbox.x2 - bbox.x1;


        const textHeight =
            bbox.y2 - bbox.y1;


        /*
         * ====================================================
         * SVG-DIMENSIONEN
         * ====================================================
         */

        const width =
            textWidth +
            RED_OFFSET +
            BLUE_OFFSET +
            PADDING * 2;


        const height =
            textHeight +
            RED_OFFSET +
            BLUE_OFFSET +
            PADDING * 2;


        /*
         * ====================================================
         * POSITION
         * ====================================================
         */

        const x =
            PADDING - bbox.x1;


        const baseline =
            PADDING - bbox.y1;


        /*
         * ====================================================
         * BLAUER SCHATTEN
         * ====================================================
         */

        const blue =
            font.getPath(

                TEXT,

                x - BLUE_OFFSET,

                baseline - BLUE_OFFSET,

                FONT_SIZE

            );


        /*
         * ====================================================
         * ROTER SCHATTEN
         * ====================================================
         */

        const red =
            font.getPath(

                TEXT,

                x + RED_OFFSET,

                baseline + RED_OFFSET,

                FONT_SIZE

            );


        /*
         * ====================================================
         * HAUPTTEXT
         * ====================================================
         */

        const main =
            font.getPath(

                TEXT,

                x,

                baseline,

                FONT_SIZE

            );


        /*
         * ====================================================
         * PFADDATEN
         * ====================================================
         */

        const blueData =
            blue.toPathData(3);


        const redData =
            red.toPathData(3);


        const mainData =
            main.toPathData(3);


        /*
         * ====================================================
         * ECHTES SVG
         * ====================================================
         *
         * NUR:
         *
         * <path>
         *
         * Keine Schrift.
         * Kein Canvas.
         * Kein PNG.
         * Kein JPEG.
         */

        const svg =

`<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    version="1.1"
    viewBox="0 0 ${width} ${height}"
>

    <!-- BLUE RISO OFFSET -->

    <path
        d="${blueData}"
        fill="${BLUE}"
    />


    <!-- RED RISO OFFSET -->

    <path
        d="${redData}"
        fill="${RED}"
    />


    <!-- MAIN LETTERING -->

    <path
        d="${mainData}"
        fill="${PAPER}"
    />

</svg>`;


        /*
         * ====================================================
         * VORSCHAU
         * ====================================================
         */

        document.getElementById("preview").innerHTML =
            svg;


        /*
         * ====================================================
         * STATUS
         * ====================================================
         */

        document.getElementById("status").textContent =
            "✓ Fertig – SVG enthält ausschließlich Vektorpfade.";


        /*
         * ====================================================
         * DOWNLOAD
         * ====================================================
         */

        const button =
            document.getElementById("download");


        button.disabled = false;


        button.onclick = function() {


            const blob =
                new Blob(

                    [svg],

                    {
                        type:
                            "image/svg+xml;charset=utf-8"
                    }

                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href =
                url;


            link.download =
                "villa-39-schriftzug-vector.svg";


            document.body.appendChild(link);


            link.click();


            document.body.removeChild(link);


            setTimeout(

                () => {
                    URL.revokeObjectURL(url);
                },

                1000

            );

        };


    }


    catch (error) {


        console.error(error);


        document.getElementById("status").textContent =
            "FEHLER: " + error.message;


        document.getElementById("preview").innerHTML =

            `<div style="
                color:#E7412D;
                font-family:monospace;
                font-size:16px;
            ">
                ${error.message}
            </div>`;

    }

}


/* ============================================================
   START
   ============================================================ */

createSVG();

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<title>Villa 39 – SVG Export</title>


<!-- =========================================================
     GOOGLE FONT
     ========================================================= -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
    rel="stylesheet">


<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    padding: 40px;

    background: #333;

    color: white;

    font-family: Arial, sans-serif;

}

h1 {

    margin: 0 0 10px;

    font-size: 20px;

}

#status {

    margin-bottom: 25px;

    font-family: monospace;

}


/* =========================================================
   TRANSPARENZ-VORSCHAU
   ========================================================= */

#preview {

    display: inline-block;

    padding: 40px;

    max-width: calc(100vw - 80px);

    overflow: auto;


    background-color: white;

    background-image:

        linear-gradient(
            45deg,
            #ccc 25%,
            transparent 25%
        ),

        linear-gradient(
            -45deg,
            #ccc 25%,
            transparent 25%
        ),

        linear-gradient(
            45deg,
            transparent 75%,
            #ccc 75%
        ),

        linear-gradient(
            -45deg,
            transparent 75%,
            #ccc 75%
        );

    background-size: 32px 32px;

    background-position:

        0 0,
        0 16px,
        16px -16px,
        -16px 0;

}


#preview svg {

    display: block;

    width: min(
        1000px,
        calc(100vw - 160px)
    );

    height: auto;

}


button {

    display: block;

    margin-top: 25px;

    padding: 14px 24px;

    border: 0;

    background: #E7412D;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}

button:disabled {

    opacity: .4;

    cursor: default;

}

</style>

</head>


<body>


<h1>Villa 39 — SVG</h1>


<div id="status">
    Lade Archivo Black …
</div>


<div id="preview"></div>


<button id="download" disabled>
    SVG herunterladen
</button>


<script>


/* =========================================================
   ORIGINALWERTE AUS DEINEM HERO
   ========================================================= */

const TEXT = "Villa 39";

const FONT = "Archivo Black";

const MAIN_COLOR = "#F1ECDD";

const RED = "#E7412D";

const BLUE = "#1D4C8C";


/*
 * Dein ursprünglicher CSS-Schatten:
 *
 * text-shadow:
 *     4px 4px 0 var(--riso-red),
 *    -2px -2px 0 var(--riso-blue);
 *
 * Diese Werte werden hier proportional zur Schriftgröße
 * skaliert.
 */


/* =========================================================
   STATUS
   ========================================================= */

const status =
    document.getElementById("status");


function setStatus(text) {

    status.textContent = text;

}


/* =========================================================
   AUF FONT WARTEN
   ========================================================= */

async function loadArchivo() {

    setStatus(
        "Warte auf Archivo Black …"
    );


    /*
     * Erst warten, bis alle @font-face-Regeln
     * fertig verarbeitet sind.
     */

    await document.fonts.ready;


    /*
     * Archivo Black explizit laden.
     */

    await document.fonts.load(
        '900 200px "Archivo Black"'
    );


    /*
     * Noch einmal warten.
     */

    await document.fonts.ready;


    /*
     * Prüfen.
     */

    if (
        !document.fonts.check(
            '900 200px "Archivo Black"'
        )
    ) {

        throw new Error(
            "Archivo Black konnte nicht geladen werden."
        );

    }


    setStatus(
        "✓ Archivo Black geladen"
    );

}


/* =========================================================
   SCHRIFT MESSEN
   ========================================================= */

function measureText() {

    const canvas =
        document.createElement("canvas");


    const ctx =
        canvas.getContext("2d");


    /*
     * Große Referenzgröße.
     */

    const fontSize = 1000;


    ctx.font =
        `900 ${fontSize}px "${FONT}"`;


    const metrics =
        ctx.measureText(TEXT);


    return {

        width:
            metrics.width,

        ascent:
            metrics.actualBoundingBoxAscent,

        descent:
            metrics.actualBoundingBoxDescent

    };

}


/* =========================================================
   SVG ERZEUGEN
   ========================================================= */

function createSVG() {


    const metrics =
        measureText();


    /*
     * =====================================================
     * ZIELGRÖSSE
     * =====================================================
     *
     * SVG wird ungefähr 3000px breit.
     *
     * Da SVG Vektor ist, ist die konkrete Pixelgröße
     * später ohnehin beliebig skalierbar.
     */

    const targetWidth = 3000;


    /*
     * 1000px Referenzschrift → gewünschte Breite.
     */

    const scale =
        targetWidth /
        metrics.width;


    const fontSize =
        1000 * scale;


    /*
     * Schatten proportional zur Originalgröße.
     *
     * Original:
     *
     * 80px Schrift ungefähr
     * 4px rot
     * 2px blau
     *
     * Daher:
     */

    const redOffset =
        fontSize * (4 / 80);


    const blueOffset =
        fontSize * (2 / 80);


    /*
     * Sicherheitsrand.
     */

    const padding =
        fontSize * 0.08;


    /*
     * Gesamtabmessungen.
     */

    const width =
        metrics.width * scale
        +
        padding * 2
        +
        redOffset;


    const height =
        (
            metrics.ascent
            +
            metrics.descent
        ) * scale
        +
        padding * 2
        +
        redOffset
        +
        blueOffset;


    /*
     * Baseline.
     */

    const baseline =
        padding
        +
        metrics.ascent * scale;


    /*
     * =====================================================
     * SVG
     * =====================================================
     *
     * KEIN Hintergrund-Element!
     *
     * Dadurch bleibt der komplette Bereich außerhalb
     * der Schrift transparent.
     */

    const svg = `<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"

    width="${Math.ceil(width)}"
    height="${Math.ceil(height)}"

    viewBox="0 0 ${width} ${height}"
>

    <defs>

        <!--
            Die Font wird als Font-Familie referenziert.
            Der SVG-Text bleibt vollständig vektorbasiert.
        -->

        <style>

            .villa-text {

                font-family:
                    "Archivo Black",
                    sans-serif;

                font-weight: 900;

                font-size:
                    ${fontSize}px;

                letter-spacing: 0;

            }

        </style>

    </defs>


    <!-- =================================================
         BLAUER SCHATTEN
         Original: -2px -2px
         ================================================= -->

    <text

        class="villa-text"

        x="${padding - blueOffset}"

        y="${baseline - blueOffset}"

        fill="${BLUE}"

    >${TEXT}</text>


    <!-- =================================================
         ROTER SCHATTEN
         Original: 4px 4px
         ================================================= -->

    <text

        class="villa-text"

        x="${padding + redOffset}"

        y="${baseline + redOffset}"

        fill="${RED}"

    >${TEXT}</text>


    <!-- =================================================
         HAUPTSCHRIFT
         ================================================= -->

    <text

        class="villa-text"

        x="${padding}"

        y="${baseline}"

        fill="${MAIN_COLOR}"

    >${TEXT}</text>


</svg>`;


    return svg;

}


/* =========================================================
   SVG IM BROWSER ANZEIGEN
   ========================================================= */

function showSVG(svgString) {


    const preview =
        document.getElementById("preview");


    preview.innerHTML =
        svgString;


    /*
     * SVG-Element direkt holen.
     */

    const svg =
        preview.querySelector("svg");


    if (!svg) {

        throw new Error(
            "SVG konnte nicht erzeugt werden."
        );

    }


    setStatus(
        "✓ SVG erzeugt – vollständig skalierbar"
    );

}


/* =========================================================
   DOWNLOAD
   ========================================================= */

function enableDownload(svgString) {


    const button =
        document.getElementById("download");


    button.disabled =
        false;


    button.onclick =
        function() {


            const blob =
                new Blob(
                    [svgString],
                    {
                        type:
                            "image/svg+xml;charset=utf-8"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href =
                url;


            link.download =
                "villa-39-schriftzug.svg";


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            setTimeout(
                function() {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );


            setStatus(
                "✓ villa-39-schriftzug.svg heruntergeladen"
            );

        };

}


/* =========================================================
   START
   ========================================================= */

async function init() {


    try {


        await loadArchivo();


        const svg =
            createSVG();


        showSVG(svg);


        enableDownload(svg);


    }
    catch (error) {


        console.error(error);


        setStatus(
            "FEHLER: " +
            error.message
        );


    }

}


init();

</script>

</body>

</html>

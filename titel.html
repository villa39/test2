<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Villa 39 – High Resolution Export</title>

    <!-- =====================================================
         GOOGLE FONT
         ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
        rel="stylesheet"
    >


    <style>

        :root {
            --paper: #F1ECDD;
            --red: #E7412D;
            --blue: #1D4C8C;
            --ink: #1C1B18;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            padding: 40px;

            background: #555;

            font-family: Arial, sans-serif;

            color: white;

        }


        h1 {

            margin: 0 0 10px;

            font-size: 22px;

        }


        #status {

            margin-bottom: 25px;

            font-family: monospace;

            color: #fff;

        }


        /*
         * ====================================================
         * TRANSPARENZ-VORSCHAU
         * ====================================================
         */

        #preview {

            display: inline-block;

            padding: 40px;

            background-color: white;

            background-image:

                linear-gradient(
                    45deg,
                    #ccc 25%,
                    transparent 25%
                ),

                linear-gradient(
                    -45deg,
                    #ccc 25%,
                    transparent 25%
                ),

                linear-gradient(
                    45deg,
                    transparent 75%,
                    #ccc 75%
                ),

                linear-gradient(
                    -45deg,
                    transparent 75%,
                    #ccc 75%
                );

            background-size: 40px 40px;

            background-position:
                0 0,
                0 20px,
                20px -20px,
                -20px 0;

            max-width: 100%;

            overflow: auto;

        }


        #
